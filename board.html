<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Prairie Herald: Class Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Old+Standard+TT:wght@400;700&family=Press+Start+2P&family=Rye&display=swap" rel="stylesheet">
<link rel="icon" href="assets/brand/favicon.webp">
<link rel="stylesheet" href="style.css">
</head>
<body class="board">
<div id="paper">
  <div class="masthead"><img class="orn" src="assets/board/ornaments/masthead-left.webp" alt=""><h1>The Prairie Herald</h1><img class="orn" src="assets/board/ornaments/masthead-right.webp" alt=""></div>
  <div class="dateline"><span id="dl-left">Homestead County</span><span id="dl-mid"></span><span id="dl-right"></span></div>
  <div class="columns">
    <div class="lead" id="lead"></div>
    <div class="county"><h3 id="countyTitle">The County Map</h3><div class="famgrid" id="fams"></div></div>
  </div>
  <div class="controls">
    <span class="status" id="status"></span><span class="spacer" style="flex:1"></span>
    <button class="light" id="introBtn">Homestead Act</button>
    <button class="light" id="savesBtn">Save / Load Class</button>
    <button class="light" id="resetBtn">New Game</button>
    <button id="advBtn"></button>
  </div>
</div>
<div id="explainer" class="explainer hidden"></div>
<div id="savesPanel" class="savepanel hidden">
  <div class="sp-inner">
    <div class="sp-head"><h3>Save or Load a Class</h3><button class="light" id="spClose">Close</button></div>
    <p id="spCurrent" class="sp-cur"></p>
    <div class="sp-saveas">
      <input id="spName" maxlength="40" placeholder="Name this class, like Period 2" autocomplete="off">
      <button id="spSave">Save</button>
      <button class="light" id="spDownload">Download Save File</button>
    </div>
    <p class="sp-tip">To pick up another day: open the class here. It keeps the same join code, so each group opens the game, types the code, and clicks its family under "Already joined?"</p>
    <h4>Saved classes on this computer</h4>
    <div id="spList"></div>
    <label class="sp-file">Open a save file from another computer<input type="file" id="spFile" accept=".json,application/json" hidden></label>
  </div>
</div>
<div id="toast"></div>
<script src="vendor/qrcode.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script src="engine.js"></script>
<script src="common.js"></script>
<script src="host.js"></script>
<script src="board.js"></script>
</body>
</html>
